name: Build Windows desktop
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 "nvidia-cublas-cu12>=12.4,<13" "nvidia-cudnn-cu12>=9.1,<10" "nvidia-cuda-runtime-cu12>=12.4,<13"
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean Kotoba.spec
      - run: python bundle_gpu.py dist/Kotoba/_internal
      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Windows
          path: dist/Kotoba/
