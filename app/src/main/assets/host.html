<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<style>html,body{margin:0;height:100%;background:#FFE6F3;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
window.__SPR = __SPR__;
window.__CODE = __CODE__;
(function () {
  'use strict';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var imgs = {};
  var G = {
    ctx: ctx, w: 0, h: 0, dpr: dpr, done: false, touches: [],
    rand: function (a, b) { return a + Math.random() * (b - a); },
    randInt: function (n) { return Math.floor(Math.random() * n); },
    win: function () { finish(true); },
    lose: function () { finish(false); },
    // Спрайт: своя картинка (если задана в редакторе графики) или рисунок по умолчанию draw(ctx, size)
    sprite: function (name, size, draw) {
      if (imgs[name]) return imgs[name];
      var c = document.createElement('canvas');
      c.width = c.height = size || 64;
      try { draw(c.getContext('2d'), c.width); } catch (e) { report(e); }
      return c;
    }
  };
  function finish(w) {
    if (G.done) return;
    G.done = true;
    try { if (window.VadBridge) VadBridge.finish(!!w); } catch (e) {}
  }
  function report(e) {
    try { if (window.VadBridge) VadBridge.error(String((e && e.message) || e)); } catch (_) {}
  }
  window.onerror = function (m, s, l) { report(m + ' (line ' + l + ')'); };
  window.G = G;
  function fit() {
    cv.width = Math.max(1, Math.round(innerWidth * dpr));
    cv.height = Math.max(1, Math.round(innerHeight * dpr));
    G.w = cv.width; G.h = cv.height;
  }
  window.addEventListener('resize', fit); fit();

  var pts = {}, st = {};
  function call(name, a, b) {
    var f = window[name];
    if (typeof f === 'function') { try { f(a, b); } catch (e) { report(e); } }
  }
  function sync() {
    G.touches = Object.keys(pts).map(function (k) { return pts[k]; });
    call('onTouch', G.touches);
  }
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    var p = { x: e.clientX * dpr, y: e.clientY * dpr };
    pts[e.pointerId] = p; st[e.pointerId] = { x: p.x, y: p.y };
    call('onTap', p.x, p.y);
    sync();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var p = { x: e.clientX * dpr, y: e.clientY * dpr };
    pts[e.pointerId] = p;
    var s = st[e.pointerId], dx = p.x - s.x, dy = p.y - s.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22 * dpr) {
      call('onSwipe', Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
      s.x = p.x; s.y = p.y;
    }
    sync();
  });
  function up(e) { delete pts[e.pointerId]; delete st[e.pointerId]; sync(); }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  var last = 0;
  function loop(t) {
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
    last = t;
    if (!G.done) call('update', dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, G.w, G.h);
    call('draw', ctx);
    requestAnimationFrame(loop);
  }
  function start() {
    try {
      var s = document.createElement('script');
      s.text = window.__CODE;
      document.body.appendChild(s);
    } catch (e) { report(e); }
    call('init', G);
    requestAnimationFrame(loop);
  }
  var names = Object.keys(window.__SPR || {}), left = names.length;
  if (!left) start();
  names.forEach(function (n) {
    var im = new Image();
    im.onload = im.onerror = function () { if (im.width) imgs[n] = im; if (--left === 0) start(); };
    im.src = window.__SPR[n];
  });
})();
</script></body></html>
